# orchastartes each services 
# always depend on docker file for some details
# version: "3.8"
services:
  backend:
    build: ./backend
    container_name: siemens-rag-backend
    ports:
      - "8000:8000"
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/chroma_data:/app/chroma_data
      - ./backend/data:/app/data

  frontend:
    build: ./frontend
    container_name: siemens-rag-frontend
    ports:
      - "5173:5173"
    restart: always
    depends_on:
      - backend

